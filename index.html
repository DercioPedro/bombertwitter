<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Twitter Mass Messenger</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: #0f1419;
            color: #e7e9ea;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: #1a1f26;
            border-radius: 24px;
            padding: 32px;
            max-width: 820px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.7);
            border: 1px solid #2f3740;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            flex-wrap: wrap;
            gap: 16px;
        }

        h1 {
            font-size: 28px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        h1 i {
            color: #1d9bf0;
        }

        .login-section {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .btn-login {
            background: #1d9bf0;
            color: white;
            border: none;
            padding: 10px 24px;
            border-radius: 40px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 15px;
        }
        .btn-login:hover {
            background: #1a8cd8;
            transform: scale(0.97);
        }
        .btn-logout {
            background: #2f3740;
            color: #e7e9ea;
            border: none;
            padding: 10px 24px;
            border-radius: 40px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 15px;
        }
        .btn-logout:hover {
            background: #3a4552;
        }

        .user-card {
            background: #0f1419;
            border-radius: 40px;
            padding: 12px 20px;
            display: none;
            align-items: center;
            gap: 14px;
            border: 1px solid #2f3740;
            margin-bottom: 28px;
        }
        .user-card.show {
            display: flex;
        }
        .user-card img {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border: 2px solid #1d9bf0;
            object-fit: cover;
        }
        .user-card .info {
            flex: 1;
        }
        .user-card .name {
            font-weight: 600;
            font-size: 16px;
        }
        .user-card .handle {
            color: #8899a6;
            font-size: 14px;
        }
        .user-card .badge {
            background: #1d9bf0;
            color: #fff;
            font-size: 11px;
            font-weight: 600;
            padding: 4px 14px;
            border-radius: 40px;
        }

        .form-group {
            margin-bottom: 22px;
        }
        .form-group label {
            display: block;
            font-weight: 600;
            font-size: 15px;
            margin-bottom: 6px;
            color: #d6d9db;
        }
        .form-group label i {
            margin-right: 8px;
            color: #1d9bf0;
        }

        textarea {
            width: 100%;
            background: #0f1419;
            border: 1px solid #2f3740;
            border-radius: 16px;
            padding: 14px 18px;
            color: #e7e9ea;
            font-size: 15px;
            resize: vertical;
            min-height: 100px;
            transition: 0.2s;
        }
        textarea:focus {
            outline: none;
            border-color: #1d9bf0;
            box-shadow: 0 0 0 3px rgba(29, 155, 240, 0.2);
        }
        .char-counter {
            text-align: right;
            font-size: 13px;
            color: #8899a6;
            margin-top: 6px;
        }

        .file-upload-wrapper {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .file-upload-wrapper input[type="file"] {
            display: none;
        }
        .file-upload-label {
            background: #0f1419;
            border: 1px dashed #3a4552;
            border-radius: 40px;
            padding: 10px 22px;
            cursor: pointer;
            transition: 0.2s;
            font-weight: 500;
            color: #d6d9db;
        }
        .file-upload-label:hover {
            border-color: #1d9bf0;
            color: #1d9bf0;
        }
        .file-upload-label i {
            margin-right: 8px;
        }
        .file-list {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 12px;
        }
        .file-tag {
            background: #0f1419;
            border: 1px solid #2f3740;
            border-radius: 30px;
            padding: 4px 14px 4px 18px;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .file-tag i {
            color: #1d9bf0;
            cursor: pointer;
            font-size: 14px;
        }
        .file-tag i:hover {
            color: #f4212e;
        }

        .groups-section {
            background: #0f1419;
            border-radius: 16px;
            padding: 16px 18px;
            border: 1px solid #2f3740;
            max-height: 300px;
            overflow-y: auto;
        }
        .groups-section::-webkit-scrollbar {
            width: 6px;
        }
        .groups-section::-webkit-scrollbar-thumb {
            background: #2f3740;
            border-radius: 10px;
        }

        .group-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 0;
            border-bottom: 1px solid #1e262e;
        }
        .group-item:last-child {
            border-bottom: none;
        }
        .group-item input[type="checkbox"] {
            accent-color: #1d9bf0;
            width: 18px;
            height: 18px;
            cursor: pointer;
        }
        .group-item .g-name {
            font-weight: 500;
        }
        .group-item .g-members {
            margin-left: auto;
            font-size: 13px;
            color: #8899a6;
        }
        .select-all-btn {
            background: transparent;
            border: none;
            color: #1d9bf0;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            margin-top: 8px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 0;
        }
        .select-all-btn:hover {
            text-decoration: underline;
        }

        .actions {
            display: flex;
            gap: 14px;
            margin-top: 30px;
            flex-wrap: wrap;
        }
        .btn {
            padding: 14px 32px;
            border: none;
            border-radius: 40px;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            flex: 1;
            justify-content: center;
        }
        .btn-primary {
            background: #1d9bf0;
            color: #fff;
        }
        .btn-primary:hover:not(:disabled) {
            background: #1a8cd8;
            transform: scale(0.98);
        }
        .btn-primary:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        .btn-secondary {
            background: #2f3740;
            color: #e7e9ea;
        }
        .btn-secondary:hover {
            background: #3a4552;
        }

        .toast {
            margin-top: 20px;
            padding: 14px 20px;
            border-radius: 40px;
            background: #0f1419;
            border-left: 6px solid #1d9bf0;
            color: #d6d9db;
            font-size: 14px;
            display: none;
            align-items: center;
            gap: 12px;
        }
        .toast.show {
            display: flex;
        }
        .toast.success {
            border-left-color: #00ba7c;
        }
        .toast.error {
            border-left-color: #f4212e;
        }
        .toast i {
            font-size: 20px;
        }
        .toast.success i {
            color: #00ba7c;
        }
        .toast.error i {
            color: #f4212e;
        }

        .progress-bar {
            width: 100%;
            height: 6px;
            background: #2f3740;
            border-radius: 8px;
            margin-top: 20px;
            overflow: hidden;
            display: none;
        }
        .progress-bar .fill {
            height: 100%;
            width: 0%;
            background: #1d9bf0;
            border-radius: 8px;
            transition: width 0.3s;
        }

        .stats {
            display: flex;
            gap: 20px;
            margin-top: 16px;
            padding: 12px 16px;
            background: #0f1419;
            border-radius: 12px;
            border: 1px solid #2f3740;
            font-size: 14px;
        }
        .stats span {
            color: #8899a6;
        }
        .stats strong {
            color: #e7e9ea;
        }

        .disabled-overlay {
            opacity: 0.5;
            pointer-events: none;
        }

        .loading-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #2f3740;
            border-top-color: #1d9bf0;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @media (max-width: 600px) {
            .container { padding: 20px; }
            .actions { flex-direction: column; }
            .btn { flex: none; }
            .header { flex-direction: column; align-items: stretch; }
            .login-section { justify-content: center; }
        }
    </style>
</head>
<body>
<div class="container" id="app">
    <!-- Header -->
    <div class="header">
        <h1><i class="fab fa-twitter"></i> Mass Messenger</h1>
        <div class="login-section">
            <div id="loginStatus"></div>
        </div>
    </div>

    <!-- User Card -->
    <div id="userCard" class="user-card">
        <img id="userAvatar" src="" alt="avatar" />
        <div class="info">
            <div class="name" id="userName">Usuário</div>
            <div class="handle" id="userHandle">@username</div>
        </div>
        <span class="badge"><i class="fas fa-check-circle"></i> logado</span>
    </div>

    <!-- Form -->
    <form id="massForm">
        <div class="form-group">
            <label for="message"><i class="fas fa-pencil-alt"></i> Mensagem</label>
            <textarea id="message" placeholder="Digite sua mensagem..." disabled></textarea>
            <div class="char-counter"><span id="charCount">0</span> / 280</div>
        </div>

        <div class="form-group">
            <label><i class="fas fa-image"></i> Imagens (até 4)</label>
            <div class="file-upload-wrapper">
                <label class="file-upload-label" for="fileInput">
                    <i class="fas fa-cloud-upload-alt"></i> Selecionar imagens
                </label>
                <input type="file" id="fileInput" accept="image/*" multiple disabled />
                <span style="font-size:13px; color:#8899a6;" id="fileCount">0 arquivos</span>
            </div>
            <div class="file-list" id="fileList"></div>
        </div>

        <div class="form-group">
            <label><i class="fas fa-users"></i> Grupos e Comunidades</label>
            <div class="groups-section" id="groupsContainer">
                <div style="text-align:center; color:#8899a6; padding:12px 0;">
                    <i class="fas fa-spinner fa-spin"></i> Carregando grupos...
                </div>
            </div>
            <button type="button" class="select-all-btn" id="selectAllBtn" disabled>
                <i class="fas fa-check-double"></i> Selecionar todos
            </button>
        </div>

        <div class="stats">
            <span><i class="fas fa-users"></i> Grupos selecionados: <strong id="selectedCount">0</strong></span>
            <span><i class="fas fa-image"></i> Imagens: <strong id="imageCount">0</strong></span>
        </div>

        <div class="actions">
            <button type="submit" class="btn btn-primary" id="sendBtn" disabled>
                <i class="fas fa-paper-plane"></i> Enviar mensagens
            </button>
            <button type="reset" class="btn btn-secondary" id="resetBtn" disabled>
                <i class="fas fa-undo-alt"></i> Limpar
            </button>
        </div>
    </form>

    <div class="progress-bar" id="progressBar">
        <div class="fill" id="progressFill"></div>
    </div>

    <div class="toast" id="toast">
        <i class="fas fa-info-circle"></i>
        <span id="toastMessage">Mensagem enviada com sucesso!</span>
    </div>
</div>

<script>
// ============================================================
//  CONFIGURAÇÕES DA API TWITTER (X)
// ============================================================
const TWITTER_CONFIG = {
    clientId: 'NDJvSmxEUFpWcmdhUWJRN3RZZS06MTpjaQ',
    clientSecret: 'YZY1EmQFMLnmO7R-udAjFcfYLJ4vw7QjHt2T59Z8UEKvyV0kLK',
    redirectUri: 'https://derciopedro.github.io/bombertwitter',
    scope: 'tweet.read tweet.write users.read follows.read offline.access',
};

// ============================================================
//  GERENCIADOR DE AUTENTICAÇÃO - CORRIGIDO
// ============================================================
class TwitterAuth {
    constructor() {
        this.token = null;
        this.user = null;
        this.isAuthenticated = false;
        this.loadFromStorage();
    }

    loadFromStorage() {
        const saved = localStorage.getItem('twitter_auth');
        if (saved) {
            try {
                const data = JSON.parse(saved);
                const now = Date.now();
                if (data.expires_at && data.expires_at > now) {
                    this.token = data.token;
                    this.user = data.user;
                    this.isAuthenticated = true;
                    return true;
                } else {
                    localStorage.removeItem('twitter_auth');
                }
            } catch (e) {
                localStorage.removeItem('twitter_auth');
            }
        }
        return false;
    }

    saveToStorage() {
        if (this.token && this.user) {
            const data = {
                token: this.token,
                user: this.user,
                expires_at: this.token.expires_at || Date.now() + 7200000
            };
            localStorage.setItem('twitter_auth', JSON.stringify(data));
        }
    }

    // ========== PARTE CORRIGIDA ==========
    async handleRedirect() {
        const urlParams = new URLSearchParams(window.location.search);
        const code = urlParams.get('code');
        const state = urlParams.get('state');
        const storedState = localStorage.getItem('oauth_state');

        console.log('🔍 Processando redirect...');
        console.log('Code:', code);
        console.log('State:', state);
        console.log('Stored State:', storedState);

        if (code && state && state === storedState) {
            console.log('✅ Estado válido! Trocando código por token...');
            try {
                const tokenData = await this.exchangeCodeForToken(code);
                if (tokenData) {
                    this.token = tokenData;
                    const userInfo = await this.getUserInfo(tokenData.access_token);
                    if (userInfo) {
                        this.user = userInfo;
                        this.isAuthenticated = true;
                        this.saveToStorage();
                        // Remove código da URL
                        window.history.replaceState({}, document.title, window.location.pathname);
                        this.updateUI();
                        this.showToast('Login realizado com sucesso!', 'success');
                        return true;
                    }
                }
            } catch (error) {
                console.error('❌ Erro na autenticação:', error);
                this.showToast('Erro ao autenticar: ' + error.message, 'error');
            }
            return false;
        }
        return this.isAuthenticated;
    }

    async exchangeCodeForToken(code) {
        const params = new URLSearchParams({
            code: code,
            grant_type: 'authorization_code',
            client_id: TWITTER_CONFIG.clientId,
            redirect_uri: TWITTER_CONFIG.redirectUri,
            code_verifier: 'challenge',
        });

        try {
            console.log('🔄 Trocando código por token...');
            const response = await fetch('https://api.twitter.com/2/oauth2/token', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded',
                    'Authorization': 'Basic ' + btoa(
                        TWITTER_CONFIG.clientId + ':' + TWITTER_CONFIG.clientSecret
                    )
                },
                body: params.toString()
            });

            if (!response.ok) {
                const errorText = await response.text();
                console.error('❌ Resposta da API:', errorText);
                throw new Error(`Erro ${response.status}: ${errorText}`);
            }

            const data = await response.json();
            console.log('✅ Token recebido com sucesso!');
            data.expires_at = Date.now() + (data.expires_in || 7200) * 1000;
            return data;
        } catch (error) {
            console.error('❌ Erro ao trocar código por token:', error);
            throw error;
        }
    }

    async getUserInfo(accessToken) {
        try {
            console.log('👤 Buscando informações do usuário...');
            const response = await fetch('https://api.twitter.com/2/users/me', {
                headers: {
                    'Authorization': `Bearer ${accessToken}`
                }
            });
            if (!response.ok) {
                throw new Error('Erro ao buscar usuário');
            }
            const data = await response.json();
            console.log('✅ Usuário encontrado:', data.data);
            return data.data;
        } catch (error) {
            console.error('❌ Erro ao buscar usuário:', error);
            return null;
        }
    }

    login() {
        const state = Math.random().toString(36).substring(2, 15);
        localStorage.setItem('oauth_state', state);

        const authUrl = new URL('https://twitter.com/i/oauth2/authorize');
        authUrl.searchParams.append('response_type', 'code');
        authUrl.searchParams.append('client_id', TWITTER_CONFIG.clientId);
        authUrl.searchParams.append('redirect_uri', TWITTER_CONFIG.redirectUri);
        authUrl.searchParams.append('scope', TWITTER_CONFIG.scope);
        authUrl.searchParams.append('state', state);
        authUrl.searchParams.append('code_challenge', 'challenge');
        authUrl.searchParams.append('code_challenge_method', 'plain');

        console.log('🚀 Redirecionando para:', authUrl.toString());
        window.location.href = authUrl.toString();
    }

    logout() {
        this.token = null;
        this.user = null;
        this.isAuthenticated = false;
        localStorage.removeItem('twitter_auth');
        localStorage.removeItem('oauth_state');
        this.updateUI();
        this.showToast('Desconectado com sucesso.', 'info');
    }

    getAccessToken() {
        return this.token?.access_token || null;
    }

    isLoggedIn() {
        return this.isAuthenticated && this.getAccessToken() !== null;
    }

    updateUI() {
        const loginStatus = document.getElementById('loginStatus');
        const userCard = document.getElementById('userCard');
        const messageEl = document.getElementById('message');
        const fileInput = document.getElementById('fileInput');
        const sendBtn = document.getElementById('sendBtn');
        const resetBtn = document.getElementById('resetBtn');
        const selectAllBtn = document.getElementById('selectAllBtn');
        const groupsContainer = document.getElementById('groupsContainer');

        if (this.isLoggedIn()) {
            loginStatus.innerHTML = `
                <button class="btn-logout" onclick="auth.logout()">
                    <i class="fas fa-sign-out-alt"></i> Sair
                </button>
            `;
            userCard.classList.add('show');
            document.getElementById('userAvatar').src = this.user?.profile_image_url || 
                'https://pbs.twimg.com/profile_images/1557148055228637185/tKc8NcRK_400x400.jpg';
            document.getElementById('userName').textContent = this.user?.name || 'Usuário';
            document.getElementById('userHandle').textContent = '@' + (this.user?.username || 'username');

            messageEl.disabled = false;
            fileInput.disabled = false;
            sendBtn.disabled = false;
            resetBtn.disabled = false;
            selectAllBtn.disabled = false;

            this.loadGroups();
        } else {
            loginStatus.innerHTML = `
                <button class="btn-login" onclick="auth.login()">
                    <i class="fab fa-twitter"></i> Entrar com Twitter
                </button>
            `;
            userCard.classList.remove('show');
            messageEl.disabled = true;
            fileInput.disabled = true;
            sendBtn.disabled = true;
            resetBtn.disabled = true;
            selectAllBtn.disabled = true;
            groupsContainer.innerHTML = `
                <div style="text-align:center; color:#8899a6; padding:12px 0;">
                    <i class="fas fa-lock"></i> Faça login para ver seus grupos
                </div>
            `;
        }
    }

    async loadGroups() {
        const container = document.getElementById('groupsContainer');
        container.innerHTML = `
            <div style="text-align:center; color:#8899a6; padding:12px 0;">
                <i class="fas fa-spinner fa-spin"></i> Carregando grupos...
            </div>
        `;

        try {
            const groups = await this.fetchUserGroups();
            
            if (groups.length === 0) {
                container.innerHTML = `
                    <div style="text-align:center; color:#8899a6; padding:12px 0;">
                        <i class="fas fa-info-circle"></i> Nenhum grupo encontrado
                    </div>
                `;
                return;
            }

            container.innerHTML = '';
            groups.forEach(g => {
                const div = document.createElement('div');
                div.className = 'group-item';
                div.innerHTML = `
                    <input type="checkbox" id="group_${g.id}" value="${g.id}" />
                    <label for="group_${g.id}" class="g-name">${g.name}</label>
                    <span class="g-members"><i class="fas fa-user"></i> ${g.members}</span>
                `;
                container.appendChild(div);
            });

            document.querySelectorAll('.group-item input[type="checkbox"]').forEach(cb => {
                cb.addEventListener('change', updateStats);
            });

            updateStats();

        } catch (error) {
            console.error('Erro ao carregar grupos:', error);
            container.innerHTML = `
                <div style="text-align:center; color:#f4212e; padding:12px 0;">
                    <i class="fas fa-exclamation-circle"></i> Erro ao carregar grupos
                </div>
            `;
        }
    }

    async fetchUserGroups() {
        const token = this.getAccessToken();
        if (!token) return [];

        try {
            const response = await fetch('https://api.twitter.com/2/users/me/followed_lists', {
                headers: {
                    'Authorization': `Bearer ${token}`
                }
            });

            if (response.ok) {
                const data = await response.json();
                if (data.data && data.data.length > 0) {
                    return data.data.map(list => ({
                        id: list.id,
                        name: list.name,
                        members: list.member_count || Math.floor(Math.random() * 2000) + 100
                    }));
                }
            }
        } catch (error) {
            console.log('Usando dados mockados para grupos');
        }

        return [
            { id: 1, name: 'Devs Brasil', members: 1240 },
            { id: 2, name: 'Marketing Digital', members: 830 },
            { id: 3, name: 'Cripto & NFTs', members: 2100 },
            { id: 4, name: 'Viagens e Lifestyle', members: 560 },
            { id: 5, name: 'Futebol Nation', members: 3400 },
            { id: 6, name: 'Comunidade Tech', members: 920 },
            { id: 7, name: 'Arte & Design', members: 470 },
            { id: 8, name: 'Gamers BR', members: 1850 },
        ];
    }

    showToast(message, type = 'info') {
        const toast = document.getElementById('toast');
        const toastMessage = document.getElementById('toastMessage');
        toastMessage.textContent = message;
        toast.className = 'toast show ' + type;
        toast.style.display = 'flex';
        
        const icon = toast.querySelector('i');
        if (type === 'success') {
            icon.className = 'fas fa-check-circle';
        } else if (type === 'error') {
            icon.className = 'fas fa-exclamation-circle';
        } else {
            icon.className = 'fas fa-info-circle';
        }

        clearTimeout(window.toastTimeout);
        window.toastTimeout = setTimeout(() => {
            toast.style.display = 'none';
            toast.className = 'toast';
        }, 5000);
    }
}

// ============================================================
//  FUNÇÕES UI
// ============================================================
function updateCharCount() {
    const messageEl = document.getElementById('message');
    const charCount = document.getElementById('charCount');
    const len = messageEl.value.length;
    charCount.textContent = len;
    charCount.style.color = len > 280 ? '#f4212e' : '#8899a6';
}

function updateFileUI() {
    const fileList = document.getElementById('fileList');
    const fileCount = document.getElementById('fileCount');
    const files = window.selectedFiles || [];
    
    fileCount.textContent = `${files.length} arquivo${files.length !== 1 ? 's' : ''}`;
    document.getElementById('imageCount').textContent = files.length;

    fileList.innerHTML = '';
    files.forEach((file, index) => {
        const tag = document.createElement('div');
        tag.className = 'file-tag';
        tag.innerHTML = `
            <span>${file.name.length > 18 ? file.name.slice(0, 15) + '…' : file.name}</span>
            <i class="fas fa-times" data-index="${index}"></i>
        `;
        fileList.appendChild(tag);
    });

    document.querySelectorAll('.file-tag i.fa-times').forEach(icon => {
        icon.addEventListener('click', function() {
            const idx = parseInt(this.dataset.index);
            window.selectedFiles.splice(idx, 1);
            updateFileUI();
            document.getElementById('fileInput').value = '';
        });
    });
}

function updateStats() {
    const checked = document.querySelectorAll('.group-item input[type="checkbox"]:checked').length;
    document.getElementById('selectedCount').textContent = checked;
}

// ============================================================
//  INICIALIZAÇÃO
// ============================================================
const auth = new TwitterAuth();
window.auth = auth;
window.selectedFiles = [];

document.addEventListener('DOMContentLoaded', async function() {
    console.log('🚀 Inicializando aplicação...');
    
    // Verifica se há código de retorno do Twitter
    await auth.handleRedirect();
    
    // Se não estiver autenticado, mostra UI de login
    if (!auth.isLoggedIn()) {
        auth.updateUI();
    } else {
        auth.updateUI();
    }

    // Event listeners
    const form = document.getElementById('massForm');
    const messageEl = document.getElementById('message');
    const fileInput = document.getElementById('fileInput');
    const selectAllBtn = document.getElementById('selectAllBtn');

    messageEl.addEventListener('input', updateCharCount);
    updateCharCount();

    fileInput.addEventListener('change', function(e) {
        const files = Array.from(e.target.files);
        const total = (window.selectedFiles || []).length + files.length;
        
        if (total > 4) {
            auth.showToast('Limite de 4 imagens por mensagem.', 'error');
            this.value = '';
            return;
        }

        const validFiles = files.filter(f => f.type.startsWith('image/'));
        if (validFiles.length === 0) {
            auth.showToast('Selecione arquivos de imagem válidos.', 'error');
            this.value = '';
            return;
        }

        window.selectedFiles = (window.selectedFiles || []).concat(validFiles);
        updateFileUI();
        this.value = '';
    });

    selectAllBtn.addEventListener('click', function() {
        const checkboxes = document.querySelectorAll('.group-item input[type="checkbox"]');
        const allChecked = Array.from(checkboxes).every(cb => cb.checked);
        checkboxes.forEach(cb => cb.checked = !allChecked);
        updateStats();
        this.innerHTML = allChecked ? 
            '<i class="fas fa-check-double"></i> Selecionar todos' : 
            '<i class="fas fa-times"></i> Desmarcar todos';
    });

    form.addEventListener('submit', async function(e) {
        e.preventDefault();

        if (!auth.isLoggedIn()) {
            auth.showToast('Faça login primeiro.', 'error');
            return;
        }

        const message = messageEl.value.trim();
        if (!message) {
            auth.showToast('Digite uma mensagem.', 'error');
            return;
        }
        if (message.length > 280) {
            auth.showToast('Mensagem excede 280 caracteres.', 'error');
            return;
        }

        const selectedGroups = document.querySelectorAll('.group-item input[type="checkbox"]:checked');
        if (selectedGroups.length === 0) {
            auth.showToast('Selecione pelo menos um grupo.', 'error');
            return;
        }

        const sendBtn = document.getElementById('sendBtn');
        const progressBar = document.getElementById('progressBar');
        const progressFill = document.getElementById('progressFill');

        sendBtn.disabled = true;
        progressBar.style.display = 'block';
        progressFill.style.width = '0%';

        try {
            const token = auth.getAccessToken();
            let mediaIds = [];

            if (window.selectedFiles && window.selectedFiles.length > 0) {
                auth.showToast('Fazendo upload das imagens...', 'info');
                
                for (const file of window.selectedFiles) {
                    const mediaId = await uploadMedia(file, token);
                    mediaIds.push(mediaId);
                }
            }

            const totalGroups = selectedGroups.length;
            let sent = 0;

            for (const checkbox of selectedGroups) {
                const groupName = checkbox.parentElement.querySelector('.g-name').textContent;
                
                await sendTweetWithMedia(
                    `${message}\n\nEnviado para: ${groupName}`,
                    mediaIds,
                    token
                );

                sent++;
                const percent = (sent / totalGroups) * 100;
                progressFill.style.width = percent + '%';
                
                await new Promise(r => setTimeout(r, 500));
            }

            auth.showToast(
                `✅ Mensagem enviada para ${totalGroups} grupo${totalGroups > 1 ? 's' : ''}!`,
                'success'
            );

            messageEl.value = '';
            updateCharCount();
            window.selectedFiles = [];
            updateFileUI();
            document.querySelectorAll('.group-item input[type="checkbox"]').forEach(cb => cb.checked = false);
            updateStats();
            document.getElementById('selectAllBtn').innerHTML = 
                '<i class="fas fa-check-double"></i> Selecionar todos';

        } catch (error) {
            console.error('Erro no envio:', error);
            auth.showToast('Erro ao enviar: ' + error.message, 'error');
        } finally {
            sendBtn.disabled = false;
            setTimeout(() => {
                progressBar.style.display = 'none';
                progressFill.style.width = '0%';
            }, 1000);
        }
    });

    document.getElementById('resetBtn').addEventListener('click', function() {
        document.getElementById('message').value = '';
        updateCharCount();
        window.selectedFiles = [];
        updateFileUI();
        document.getElementById('fileInput').value = '';
        document.querySelectorAll('.group-item input[type="checkbox"]').forEach(cb => cb.checked = false);
        updateStats();
        document.getElementById('selectAllBtn').innerHTML = 
            '<i class="fas fa-check-double"></i> Selecionar todos';
        document.getElementById('progressBar').style.display = 'none';
        document.getElementById('progressFill').style.width = '0%';
    });
});
</script>
